name: Java CI/CD Pipeline with SonarCloud

on:
  push:
    branches:
      - main
      - 'feature/*' # Triggers on feature/branch-name paths
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-ship:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code down to the GitHub runner
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up Java Environment with dependency caching enabled
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compile code and package it into a executable jar
    - name: Build, Test and Analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Provided automatically by GitHub, no setup needed
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Added by you in Step 2
      run: mvn clean verify sonar:sonar

    # 4. Initialize buildx engine for multi-layer Docker builds
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. Log in to Docker Hub (ONLY executes when pushing/merging to main)
    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 6. Build the image (Pushes to registry ONLY on main)
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-app:${{ github.sha }}